[[headers]]
for = "/llms*.txt"

[headers.values]
Content-Type = "text/plain; charset=utf-8"
Cache-Control = "public, max-age=3600"
X-Robots-Tag = "noindex"

[[headers]]
for = "/robots.txt"

[headers.values]
Content-Type = "text/plain; charset=utf-8"

[[headers]]
for = "/bio/*"

[headers.values]
X-Robots-Tag = "noindex, follow"

